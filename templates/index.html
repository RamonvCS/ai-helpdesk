<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

        .topbar { background: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; }
        .topbar-logo { font-size: 16px; font-weight: 600; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
        .topbar-logo span { color: #2563eb; }
        .badge { background: #dbeafe; color: #1d4ed8; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }

        .layout { display: grid; grid-template-columns: 200px 1fr; height: calc(100vh - 56px); }

        .sidebar { background: #fff; border-right: 1px solid #e5e7eb; padding: 16px 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #6b7280; cursor: pointer; margin-bottom: 2px; }
        .nav-item:hover { background: #f3f4f6; }
        .nav-item.active { background: #dbeafe; color: #1d4ed8; font-weight: 500; }
        .nav-section { font-size: 10px; color: #9ca3af; padding: 12px 12px 4px; text-transform: uppercase; letter-spacing: 0.05em; }

        .main { padding: 24px; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-size: 18px; font-weight: 600; }

        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .metric-card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e5e7eb; }
        .metric-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
        .metric-value { font-size: 28px; font-weight: 600; }
        .metric-value.blue { color: #2563eb; }
        .metric-value.green { color: #16a34a; }
        .metric-value.amber { color: #d97706; }

        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }

        .tickets-list { display: flex; flex-direction: column; gap: 10px; }
        .ticket-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color 0.15s; }
        .ticket-card:hover { border-color: #93c5fd; }
        .ticket-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .ticket-id { font-size: 11px; color: #9ca3af; font-family: monospace; }
        .ticket-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        .ticket-meta { font-size: 12px; color: #6b7280; display: flex; gap: 16px; }

        .priority { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .priority-high { background: #fee2e2; color: #dc2626; }
        .priority-medium { background: #fef3c7; color: #d97706; }
        .priority-low { background: #dcfce7; color: #16a34a; }

        .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .status-open { background: #dbeafe; color: #1d4ed8; }
        .status-resolved { background: #dcfce7; color: #16a34a; }
        .status-pending { background: #fef3c7; color: #d97706; }

        .loading { text-align: center; color: #6b7280; padding: 40px; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">🖥️ IT Helpdesk <span>AI</span></div>
    <span class="badge">● AI Active</span>
    <div class="avatar">RV</div>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="nav-section">Main</div>
        <div class="nav-item active">🎫 Tickets</div>
        <div class="nav-item">🤖 AI Assistant</div>
        <div class="nav-item">📊 Metrics</div>
        <div class="nav-section">System</div>
        <div class="nav-item">👥 Users</div>
        <div class="nav-item">🖥️ Inventory</div>
        <div class="nav-item">🔒 AD Access</div>
    </div>

    <div class="main">
        <div class="page-header">
            <span class="page-title">Active Tickets</span>
            <button class="btn btn-primary" onclick="openNewTicket()">+ New Ticket</button>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <div class="metric-label">Total Tickets</div>
                <div class="metric-value blue" id="total">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Open</div>
                <div class="metric-value blue" id="open-count">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Resolved</div>
                <div class="metric-value green" id="resolved-count">—</div>
            </div>
        </div>

        <div class="tickets-list" id="tickets-list">
            <div class="loading">Loading tickets...</div>
        </div>
    </div>
</div>

<script>
    async function loadTickets() {
        const response = await fetch('/api/tickets');
        const tickets = await response.json();

        document.getElementById('total').textContent = tickets.length;
        document.getElementById('open-count').textContent = tickets.filter(t => t.status === 'open').length;
        document.getElementById('resolved-count').textContent = tickets.filter(t => t.status === 'resolved').length;

        const list = document.getElementById('tickets-list');
        list.innerHTML = tickets.map(ticket => `
            <div class="ticket-card">
                <div class="ticket-top">
                    <span class="ticket-id">INC${String(ticket.id).padStart(4, '0')}</span>
                    <span class="priority priority-${ticket.priority}">${ticket.priority}</span>
                    <span class="status status-${ticket.status}">${ticket.status}</span>
                </div>
                <div class="ticket-title">${ticket.title}</div>
                <div class="ticket-meta">
                    <span>👤 ${ticket.user_name}</span>
                    <span>🕐 ${new Date(ticket.created_at).toLocaleDateString()}</span>
                </div>
            </div>
        `).join('');
    }

    function openNewTicket() {
        alert('New ticket form — coming in next task!');
    }

    loadTickets();
</script>

</body>
</html>
